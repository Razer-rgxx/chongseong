<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>검의 언덕 시험판 · 설계함 뽑기 연출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Song+Myung&display=swap">
<style>
:root {
  /* 화면 전체가 무대(캔버스)이고, 조작부는 아래쪽 패널 하나. 큰 연출 중에는 패널이 사라지고 무대만 남는다. */
  --bg: #070b16;
  --ink: #e8eef8;
  --ink-dim: #8d9bb3;
  --panel: rgba(13, 19, 36, 0.86);
  --line: rgba(232, 238, 248, 0.16);
  --c: #ffc23d;
  --font-display: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; word-break: keep-all; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 0.4s; }
/* 초월 등급은 WebGL 화면(#gl)이 무대가 되고, 평소의 2D 캔버스는 그 위에서 잠시 비켜난다 */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; visibility: hidden; }
body.glon #gl { visibility: visible; }
body.glon #fx { opacity: 0; }

#top { position: fixed; left: 0; right: 0; top: 0; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; transition: opacity 0.4s; }
#top h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
#top span { color: var(--ink-dim); font-size: 12px; font-variant-numeric: tabular-nums; }

#panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 52%; overflow-y: auto; padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; transition: opacity 0.4s, transform 0.4s; }
.inner { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
body.cine #panel { opacity: 0; transform: translateY(24px); pointer-events: none; }
body.cine #top { opacity: 0; }

#last { min-height: 24px; display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
#last .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--c); color: var(--c); }
#last .nm { font-family: var(--font-display); font-size: 18px; }
#last .od { color: var(--ink-dim); font-size: 12px; }
#last.pop .nm { animation: pop 0.3s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes pop { from { transform: scale(1.5); } to { transform: none; } }

#roll { width: 100%; padding: 14px; border: 0; border-radius: 4px; background: var(--ink); color: #0a1020; font-weight: 700; font-size: 16px; }
#roll:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row .lbl { color: var(--ink-dim); font-size: 12px; margin-right: 2px; }
.chip { padding: 5px 11px; border-radius: 99px; background: transparent; border: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: #0a1020; border-color: var(--ink); }
.spacer { flex: 1; }

#book { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
#book li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
#book .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
#book .t b { font-weight: 600; }
#book .t small { color: var(--ink-dim); margin-left: 6px; }
#book .n { color: var(--ink-dim); font-size: 12px; }
#book button { padding: 3px 10px; border-radius: 3px; border: 1px solid var(--line); background: transparent; font-size: 12px; }

#reveal { position: fixed; left: 0; right: 0; top: 54%; padding: 0 16px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
#reveal.on { opacity: 1; }
#reveal .tier { font-size: 14px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--c); }
#reveal .name { margin-top: 6px; font-family: var(--font-display); font-size: clamp(40px, 12vw, 84px); line-height: 1.1; color: #fff; text-shadow: 0 0 24px var(--c), 0 0 70px var(--c); }
#reveal .odds { margin-top: 10px; font-size: clamp(18px, 5vw, 28px); font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
#reveal .sub { margin-top: 14px; font-family: var(--font-display); font-size: clamp(15px, 4vw, 20px); color: #f2f5fb; opacity: 0; }
#reveal.on .sub { animation: rise 1.2s 1.5s ease-out both; }
#reveal.genesis .name { text-shadow: 0 0 18px #fff, 0 0 60px #ff7a3d, 0 0 130px #ff3d2e; font-size: clamp(44px, 13vw, 96px); }
.bar { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none; z-index: 2; }
#bar-t { top: 0; } #bar-b { bottom: 0; }
body.wide .bar { height: 9vh; }
#reveal { z-index: 3; }
#reveal.beyond .name { text-shadow: -3px 0 #ff4dd8, 3px 0 #7df9ff, 0 0 26px #fff, 0 0 110px #7df9ff; font-size: clamp(46px, 14vw, 104px); }
#reveal.beyond .name span { display: inline-block; white-space: pre; }
body.glon #reveal { top: 58%; }
#reveal.beyond .tier, #reveal.beyond .odds, #reveal.beyond .sub { text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 3px rgba(0, 0, 0, 0.9); }
#intro { position: fixed; left: 0; right: 0; top: 56%; padding: 0 20px; text-align: center; white-space: pre-line; font-family: var(--font-display); font-size: clamp(18px, 5vw, 26px); line-height: 1.8; color: #f2f5fb; opacity: 0; transition: opacity 1.3s; pointer-events: none; z-index: 3; }
#intro.on { opacity: 1; }
#reveal .hint { margin-top: 22px; font-size: 12px; color: var(--ink-dim); opacity: 0; transition: opacity 0.6s 1.2s; }
#reveal.on .hint { opacity: 1; }
#reveal.on .name { animation: slam 0.55s cubic-bezier(0.15, 0.9, 0.2, 1) both; }
#reveal.beyond.on .name { animation: none; }
#reveal.beyond.on .name span { animation: slam 0.6s cubic-bezier(0.15, 0.9, 0.2, 1) both; animation-delay: calc(var(--i) * 80ms); }
#reveal.on .tier { animation: spread 1.4s cubic-bezier(0.1, 0.8, 0.2, 1) both; }
#reveal.on .odds { animation: rise 0.6s 0.35s cubic-bezier(0.15, 0.9, 0.2, 1) both; }
#reveal.relic .name { text-shadow: -3px 0 #ff4d6d, 3px 0 #4dd8ff, 0 0 30px #fff, 0 0 90px #ffe9a8; }
#reveal.relic .odds, #reveal.relic .tier { color: #ffe9a8; }
@keyframes slam { from { transform: scale(3.2); opacity: 0; filter: blur(14px); } 60% { opacity: 1; filter: blur(0); } to { transform: none; opacity: 1; } }
@keyframes spread { from { letter-spacing: 2em; opacity: 0; } to { letter-spacing: 0.5em; opacity: 1; } }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  #reveal.on .name, #reveal.on .tier, #reveal.on .odds, #last.pop .nm, #reveal.beyond.on .name span { animation: none; }
}

#td{position:fixed;inset:0;z-index:20;background:#0c0f14;color:#e4e9f2;font:14px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
body.rev #td{display:none}
#td button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#td kbd{font:11px system-ui;opacity:.55;margin-left:6px}
#tdCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#td .hud{position:absolute}
#td.ov .play,#td.ch .play,#td.dx .play{display:none!important}
#td #hTC{left:50%;top:10px;transform:translateX(-50%);min-width:240px;padding:7px 16px;border-radius:12px;background:rgba(8,10,16,.82);border:1px solid rgba(255,255,255,.08);text-align:center}
#td #hDay{font-weight:600}
#td #hBar{height:4px;margin-top:6px;border-radius:2px;background:#20242e;overflow:hidden}
#td #hBarI{display:block;height:100%;width:0;background:#e0344a}
#td #hSub{display:block;margin-top:4px;font-size:11px;color:#9aa4bf}
#td #hTR{right:12px;top:10px;display:flex;gap:6px}
#td .btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 13px;border-radius:16px;background:rgba(8,10,16,.88);border:1px solid #333a4a;font-size:13px;white-space:nowrap}
#td #bNight{border-color:#8a5a2a;background:rgba(60,34,10,.9)}
#td #hHP{left:12px;top:10px;width:210px;padding:8px 12px;border-radius:12px;background:rgba(8,10,16,.82);border:1px solid rgba(255,255,255,.08)}
#td #hHP div{display:flex;justify-content:space-between;font-size:12px;color:#aab4c8}
#td #hpB{height:6px;margin-top:5px;border-radius:3px;background:#20242e;overflow:hidden}
#td #hpI{display:block;height:100%;background:#6dff9a;transition:width .1s}
#td #help{left:12px;top:64px;font-size:11px;color:#8b96b3;max-width:34vw}
#td #cards{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;max-width:calc(100vw - 24px)}
#td .sc{position:relative;box-sizing:border-box;width:290px;max-width:calc(50vw - 16px);padding:8px 10px 8px 14px;border-radius:10px;background:rgba(10,12,18,.9);border:1px solid #2a3040;text-align:left;overflow:hidden;opacity:.72}
#td .sc.act{opacity:1;border-color:currentColor;background:rgba(22,26,38,.95)}
#td .sc.empty{color:#8b96b3}
#td .sc i{position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor}
#td .sc kbd{position:absolute;right:8px;top:7px;margin:0;color:#aab4c8}
#td .sc .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
#td .sc .sub{display:block;margin-top:1px;font-size:11px;color:#9aa4bf}
#td .sc .db{display:block;height:3px;margin:5px 0 4px;border-radius:2px;background:#20242e;overflow:hidden}
#td .sc .db em{display:block;height:100%;background:#cfd6e4}
#td .sc .in{display:block;font-size:11px;line-height:1.45;color:#c2cadb}
#td .sc .in b{color:#e4e9f2;font-weight:600;margin-right:3px}
#td .sc .in.uq{margin-top:3px;color:#ffe2a0}
#td .sc .in u{text-decoration:none;color:#c0566a}
#td #toast{left:50%;top:84px;transform:translate(-50%,-6px);max-width:min(600px,calc(100vw - 24px));padding:9px 14px;border-radius:10px;background:rgba(6,8,14,.92);font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
#td #toast.on{opacity:1;transform:translate(-50%,0)}
#td .ovl{inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,10,.86)}
#td.ov #over,#td.ch #choice,#td.dx #dexP{display:flex}
#td .box{max-width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:22px;text-align:center}
#td .box h2{margin:0 0 12px;font-size:26px}
#td .box p{color:#c9d2e6;line-height:1.7}
#td .box .btn{height:40px;padding:0 20px;margin-top:10px;font-size:14px}
#td #choice .sc{opacity:1;width:270px;max-width:100%}
#td #choice .cols{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;align-items:flex-start}
#td #choice .col{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#td #choice .col button.sw{display:block;text-align:left}
#td #choice small{color:#9aa4bf}
#td .chTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
#td .chTop h2{margin:0}
#td #chX{height:30px;margin:0;font-size:12px;color:#aab4c8}
#td .cA{order:1}#td .cN{order:2}#td .cB{order:3}
#td .btn.pick{margin-top:2px;height:36px}
#td #chX.warn{border-color:#c0566a;color:#ff8a9a}
#td #dexP .box{text-align:left;width:min(900px,calc(100vw - 24px))}
#td #dexP h3{margin:16px 0 6px;font-size:14px}
#td #dexP h3 small{color:#8b96b3;font-weight:400;margin-left:6px}
#td .dl{display:flex;flex-wrap:wrap;gap:4px}
#td .dl span{padding:3px 8px;border-radius:6px;background:#161a24;font-size:12px}
#td .dl span small{color:#8b96b3}
#td .dl .q{color:#566;background:#11141b}
#td .none{color:#8b96b3;font-size:12px}
#td #touch{display:none}
#td.touch #touch{display:block}
#td.touch #help{display:none}
#td.touch kbd{display:none}
#td #joy{left:16px;bottom:150px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);touch-action:none}
#td #joyK{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.2)}
#td #tBtns{right:14px;bottom:150px;display:grid;grid-template-columns:62px 62px;gap:8px}
#td .tb{display:flex;align-items:center;justify-content:center;height:62px;border-radius:31px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13px;touch-action:none}
#td #adm{left:12px;top:92px;z-index:5;display:none;width:320px;max-width:calc(100vw - 24px);padding:12px;border-radius:12px;background:rgba(8,10,16,.97);border:1px solid #3d2f5e}
#td.adm #adm{display:block}
#td #adm h3{margin:10px 0 6px;font-size:12px;font-weight:600;color:#c9a8ff}
#td .arow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#td #adm .btn{height:28px;padding:0 10px;font-size:12px}
#td select,#td input{height:28px;padding:0 6px;border:1px solid #333a4a;border-radius:6px;background:#161a24;color:#e4e9f2;font:12px system-ui;min-width:0;flex:1}
@media (max-width:760px){
#td #hHP{width:120px;padding:6px 9px}
#td #hTC{left:8px;right:8px;top:58px;transform:none;min-width:0;padding:6px 12px}
#td #hTR{right:8px;top:8px;gap:4px}
#td .btn{height:28px;padding:0 9px;font-size:12px}
#td #toast{top:122px}
#td .sc{padding:6px 8px 6px 12px}
#td .sc .in{font-size:10px}
#td #adm{top:124px}
}
@media (max-width:760px){
#td #toast{top:auto;bottom:112px;font-size:12px;padding:6px 10px}
}
@media (max-height:500px){
#td #joy{bottom:14px;width:112px;height:112px}
#td #tBtns{bottom:14px;grid-template-columns:54px 54px;gap:6px}
#td .tb{height:54px;border-radius:27px;font-size:12px}
#td .sc{width:230px;padding:6px 8px 6px 12px}
#td .sc .in{font-size:10px}
#td #toast{top:72px;font-size:12px;padding:5px 10px;max-width:56vw}
#td #help{display:none}
}
body.td #roll,body.td #roll+div,body.td .row .lbl,body.td .luck,body.td #auto,body.td #count{display:none!important}
</style>
</head>
<body>
<div id="td">
<canvas id="tdCv"></canvas>
<div class="hud play" id="hHP"><div><span>체력</span><span id="hpT"></span></div><div id="hpB"><i id="hpI"></i></div></div>
<div class="hud play" id="hTC"><b id="hDay"></b><div id="hBar"><i id="hBarI"></i></div><small id="hSub"></small></div>
<div class="hud play" id="hTR"><button class="btn" id="bNight" type="button">밤 맞이하기<kbd>N</kbd></button><button class="btn" id="bDex" type="button">도감<kbd>B</kbd></button><button class="btn" id="bAdm" type="button">관리<kbd>`</kbd></button></div>
<div class="hud play" id="help">WASD 걷기 · E 검 뽑기 · N 밤 맞이하기 · 클릭/Space 베기 · Shift 돌진 · Q 검 바꿔 쥐기 · B 도감</div>
<div class="hud play" id="cards"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="adm"><b>관리</b><div id="admBody"></div></div>
<div class="hud ovl" id="choice"><div class="box"><div class="chTop"><h2>두 손이 다 찼다</h2><button class="btn" id="chX" type="button">두고 간다<kbd>X</kbd></button></div><small>새 검을 어느 칸에 들까? 바꾸면 그 칸의 검은 버린다.</small><div class="cols"><div class="col cN"><small>새로 뽑은 검</small><div id="chNew"></div></div><div class="col cA"><small>지금 1번 칸</small><div id="chA"></div><button class="btn pick" id="chAb" type="button">1번 칸과 바꾸기<kbd>1</kbd></button></div><div class="col cB"><small>지금 2번 칸</small><div id="chB"></div><button class="btn pick" id="chBb" type="button">2번 칸과 바꾸기<kbd>2</kbd></button></div></div></div></div>
<div class="hud ovl" id="dexP"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">도감</h2><button class="btn" id="bDexX" type="button" style="margin:0">닫기<kbd>Esc</kbd></button></div><div id="dexBody"></div></div></div>
<div class="hud ovl" id="over"><div class="box"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn" id="bAgain" type="button">다시 오르기</button></div></div>
<div id="touch" class="play"><div class="hud" id="joy"><div id="joyK"></div></div><div class="hud" id="tBtns"><button class="tb" id="tE" type="button">뽑기</button><button class="tb" id="tQ" type="button">바꾸기</button><button class="tb" id="tD" type="button">돌진</button><button class="tb" id="tA" type="button">베기</button></div></div>
</div>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="top"><h1>설계함 뽑기</h1><span id="count">0번 열었다</span></div>
<div class="bar" id="bar-t"></div><div class="bar" id="bar-b"></div>
<div id="intro"></div>
<div id="reveal" aria-live="polite"><div class="tier"></div><div class="name"></div><div class="odds"></div><div class="sub"></div><div class="hint">화면을 누르면 넘어간다</div></div>
<div id="panel"><div class="inner">
  <div id="last"><span class="od">설계함을 열어 보자. 등급이 높을수록 연출이 길어진다.</span></div>
  <button id="roll" type="button">설계함 열기</button>
  <div class="row">
    <span class="lbl">시험용 행운</span>
    <button class="chip luck" data-l="1" aria-pressed="true" type="button">×1</button>
    <button class="chip luck" data-l="10" aria-pressed="false" type="button">×10</button>
    <button class="chip luck" data-l="100" aria-pressed="false" type="button">×100</button>
    <button class="chip luck" data-l="1000" aria-pressed="false" type="button">×1000</button>
    <span class="spacer"></span>
    <button class="chip" id="auto" aria-pressed="false" type="button">자동</button>
    <button class="chip" id="snd" aria-pressed="true" type="button">소리</button>
  </div>
  <ul id="book"></ul>
</div></div>

<script>
'use strict';
/* ===== 초월 연출용 셰이더 (WebGL1, GLSL ES 1.00) ===== */
const SH = (() => {
const VERT = 'attribute vec2 aP; void main(){ gl_Position = vec4(aP, 0., 1.); }';

const HEAD = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes, uCtr, uShake;
uniform float uS, uT;
const float PI = 3.14159265, TAU = 6.2831853;
float ss(float a, float b, float x){ float t = clamp((x - a) / (b - a), 0., 1.); return t * t * (3. - 2. * t); }
float h11(float p){ p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 h22(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }
float h31(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3 h33(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1., 0.)), f.x), mix(h21(i + vec2(0., 1.)), h21(i + vec2(1., 1.)), f.x), f.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1., 0., 0.)), f.x), mix(h31(i + vec3(0., 1., 0.)), h31(i + vec3(1., 1., 0.)), f.x), f.y),
             mix(mix(h31(i + vec3(0., 0., 1.)), h31(i + vec3(1., 0., 1.)), f.x), mix(h31(i + vec3(0., 1., 1.)), h31(i + vec3(1., 1., 1.)), f.x), f.y), f.z);
}
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= .5; } return s; }
float fbm3(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++){ s += a * vnoise3(p); p = p * 2.02 + vec3(3.1, 7.7, 5.3); a *= .5; } return s; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 enc(vec3 c){ return 1. - exp(-max(c, 0.) * 1.3); }
float dith(){ return (h21(gl_FragCoord.xy + fract(uT) * 91.7) - .5) / 200.; }
float lineCov(float d, float w, float aa){ return max(0., min(d + aa, w) - max(d - aa, -w)) / (2. * aa); }
float gridLine(float x, float P, float w, float aa){
  float d = abs(fract(x / P + .5) - .5) * P;
  return mix(lineCov(d, w, aa), 2. * w / P, ss(.25 * P, .5 * P, aa));
}
`;

/* ---------- 1막: 설계함(초입방체)을 일곱 겹의 고리가 감싸며 돌다가, 하나로 포개진다 ---------- */
const ASCENT = `
uniform float uProg, uTell, uPulse, uCollapse, uWarpT, uWarp, uSpin, uLock;
uniform vec3 uCol, uColP;
uniform vec3 uPal[7];
uniform vec4 uRg[7];
uniform vec4 uRa[7];
uniform vec4 uE[32];
uniform float uEB[32];
// 각도 칸마다 하나씩, 반지름 방향으로 달리는 빛줄기. dir>0 이면 바깥으로, dir<0 이면 안으로.
float streaks_unused(float a01, float r, float N, float seed, float len, float ph, float dir){
  float ca = a01 * N, id = floor(ca);
  float h = h11(id + seed * 17.3), h2 = h11(id * 1.7 + seed * 5.1 + 3.);
  float fa = fract(ca) - .5 - (h2 - .5) * .5;
  float z = fract(h2 * 7.3 + ph * (.35 + h * .9));
  if (dir < 0.) z = 1. - z;
  float rr = z * z * 2.8 + .02;
  float L = len * (.03 + z * z * 1.2);
  float d = (r - rr) * dir;
  float along = ss(-L, 0., d) * (1. - ss(0., .012, d));
  float lat = 1. - ss(0., .0065, abs(fa) * r * TAU / N);
  return along * lat * ss(0., .12, z) * (.4 + .6 * h);
}
void main(){
  vec2 p = (gl_FragCoord.xy - uCtr) * uS + uShake;
  float c = uCollapse;
  float sc = (1. - c) * (1. - c);
  float punch = 1. - .07 * exp(-uPulse * 7.) * step(.5, uTell);
  vec2 q = p / max(sc, .001) * punch;
  float r = length(q) + 1e-5, a = atan(q.y, q.x + 1e-6), a01 = a / TAU + .5;
  float pr = uProg, pr2 = pr * pr;
  vec3 tcol = mix(uColP, uCol, ss(0., .4, uPulse));
  vec3 col = vec3(.0211, .0338, .0692) * (1. - ss(0., .35, pr));

  // 가운데로 끌려 들어가는 도면의 모눈
  vec2 gq = rot(uSpin * .015) * q * (1. + (.3 + 1.9 * pr2) * .1 / (r * r + .1));
  float aG = uS * 1.6 / max(sc, .001) * (1. + (.3 + 1.9 * pr2) * .1 / (r * r + .1));
  float gfine = max(gridLine(gq.x, .25, .0028, aG), gridLine(gq.y, .25, .0028, aG));
  float gmaj = max(gridLine(gq.x, 1., .005, aG), gridLine(gq.y, 1., .005, aG));
  col += mix(vec3(.22, .5, .85), tcol, .45) * (gfine * .09 + gmaj * .2) * (.3 + .9 * pr) * (1. - exp(-r * r * 5.)) / (1. + r * r * .25);

  // 가운데서 그어져 나가는 작도선: 등급이 오를 때마다 더 멀리 뻗고, 눈금이 안쪽으로 흐른다
  float ext = .24 + .17 * (uTell + ss(0., .5, uPulse));
  float la = fract(a01 * 24. + uSpin * .004);
  float dl = abs(la - .5) / 24. * TAU * r;
  float major = step(.5, fract((floor(a01 * 24. + uSpin * .004) + .5) / 3.) * 1.5);
  float reach = ss(.11, .15, r) * (1. - ss(ext - .08, ext, r));
  float dashes = mix(step(.42, fract(r * 9. + uWarpT * 1.6)), 1., major);
  float cline = lineCov(dl, .0016 + .0012 * major, aG) * reach * dashes;
  float tick = lineCov(abs(fract(r * 10. + uWarpT * .5) - .5) / 10., .0015, aG) * (1. - ss(.006, .012, dl)) * major * reach;
  col += mix(vec3(.45, .8, 1.), tcol, .5) * (cline * (.16 + .3 * major) + tick * .5) * (.5 + pr);
  col += tcol * .05 * pr / (1. + r * r * 3.);
  // 떠오르는 빛 알갱이
  for (int i = 0; i < 2; i++){
    float scm = i == 0 ? 6. : 11.;
    vec2 e = q * scm + vec2(0., -uWarpT * (i == 0 ? 1.1 : .7) - uSpin * .05);
    e.x += sin(e.y * .8 + float(i) * 2.) * .3;
    vec2 id = floor(e); vec2 f = fract(e) - .5; vec2 hh = h22(id + float(i) * 31.);
    float on = step(.8 - .25 * pr, h21(id * 1.7 + 3.));
    col += mix(vec3(.7, .9, 1.), tcol, .6) * (1. - ss(0., .06, length(f - (hh - .5) * .6))) * on * (.3 + .7 * pr) * (.5 + .5 * sin(uSpin * 2. + hh.x * 20.));
  }

  // 등급마다 한 겹씩 켜지는 고리: 제각기 기울어 돌다가 마지막에 한 평면으로 포개진다
  for (int j = 0; j < 7; j++){
    vec4 rg = uRg[j]; vec4 ra = uRa[j];
    if (ra.x < 0.) continue;
    float pop = exp(-ra.x * 3.5);
    float R = ra.y * (1. + .12 * pop);
    vec2 v = vec2(rg.x * q.x + rg.y * q.y, -rg.y * q.x + rg.x * q.y);
    float ct = max(abs(rg.z), .07);
    vec2 wv = vec2(v.x, v.y / ct);
    float rho = length(wv) + 1e-5;
    float sd = (rho - R) * rho / length(vec2(wv.x, wv.y / ct));
    float al = atan(wv.y, wv.x + 1e-6) / TAU + .5 + ra.z;
    float fb = mix(.38, 1., ss(-.03, .03, wv.y * rg.w));
    float nseg = 8. + 4. * float(j);
    float fr = fract(al * nseg);
    float line = 1. - ss(0., .0055, abs(sd));
    float dash = ss(0., .04, fr) * (1. - ss(.5, .54, fr));
    float band = ss(.011, .015, sd) * (1. - ss(.03, .034, sd));
    float ticks = step(.82, fract(al * nseg * 6.)) * ss(.005, .008, -sd) * (1. - ss(.019, .023, -sd));
    float node = 1. - ss(0., .017, length(vec2((fract(al * 4.) - .5) * R * TAU / 4., sd)));
    float glyph = line * .9 + band * dash * .6 + ticks * .45 + node * 1.5;
    float glow = .008 / (abs(sd) + .008) * .11;
    col += uPal[j] * (glyph + glow) * fb * (.6 + 2.4 * pop + .5 * pr + 2.5 * uLock);
  }

  // 가운데의 설계함: 4차원 상자가 돈다
  float sr = .085 * (1. + pr * .9);
  if (r < sr * 2.4){
    float ln = 0., gw = 0.;
    for (int k = 0; k < 32; k++){
      vec4 e = uE[k];
      vec2 pa = q - e.xy, ba = e.zw - e.xy;
      float d = length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0., 1.));
      ln += (1. - ss(0., .004, d)) * uEB[k];
      gw += .003 / (d + .003) * uEB[k];
    }
    col += mix(tcol, vec3(1.), .35) * (min(ln, 1.6) * 1.5 + gw * .05);
  }
  float orb = exp(-r * r / (sr * sr * .07));
  col += vec3(1.) * orb * (.6 + pr * 1.1) + tcol * (sr * sr * .4) / (r * r + sr * sr * .4) * (.25 + .45 * pr);
  col += tcol * exp(-abs(q.y) * 55.) / (1. + abs(q.x) * 2.2) * (.1 + pr * .8);
  col += tcol * exp(-abs(q.x) * 90.) / (1. + abs(q.y) * .7) * pr * .45;

  // 등급이 오를 때: 위에서 내리꽂히는 빛, 충격파, 번개
  if (uTell > .5){
    float pw = .01 + .05 * exp(-uPulse * 5.);
    col += mix(vec3(1.), uCol, .55) * exp(-abs(q.x) / pw) * exp(-uPulse * 3.2) * 1.4;
    float R = uPulse * 2.1 + .1, wv = .02 + uPulse * .07;
    vec3 ring = vec3(exp(-pow((r - R) / wv, 2.)), exp(-pow((r - R * .97) / wv, 2.)), exp(-pow((r - R * .94) / wv, 2.)));
    col += ring * mix(vec3(1.), uCol, .6) * exp(-uPulse * 2.6) * 1.3;
    if (uPulse < .5){
      float fl = exp(-uPulse * 9.);
      for (int k = 0; k < 3; k++){
        float fk = float(k);
        float th = h11(uTell * 7.1 + fk * 3.3) * TAU;
        float jit = (vnoise(vec2(r * 9. + uTell * 3., fk * 9. + floor(uPulse * 30.))) - .5) * .5 + (vnoise(vec2(r * 31., fk * 5. + uTell)) - .5) * .12;
        float da = abs(mod(a - th - jit + PI, TAU) - PI) * r;
        float arm = (1. - ss(0., .011, da)) * (1. - ss(.2, 1.9, r));
        col += mix(vec3(1.), uCol, .5) * arm * fl * 3.;
      }
    }
  }
  col += vec3(1.) * uLock * exp(-r * r * 1.2) * .5;

  // 한 점으로 무너진다
  col *= 1. + c * 3.;
  col *= 1. - ss(.55, .95, c);
  col += vec3(1.) * exp(-dot(p, p) * 2600.) * ss(.3, .7, c) * (1. - ss(.9, 1., c)) * 4.;
  gl_FragColor = vec4(enc(col) + dith(), 1.);
}
`;

/* ---------- 2막: 모든 성이 시작된 돌, 고동치는 거대한 심장석 ---------- */
const HEART = `
uniform vec3 uCam, uTgt;
uniform float uFoc, uYaw, uBeat, uTh;
uniform float uRip[7];
const float SC = 4., CY = 5.6, AP = 2.0325, HC = 1.5, HP = 5., LC = 2.526, LP = 5.397, DC = 1.2069, DP = 1.883, TB = 1.;
void clipP(vec3 n, float d, vec3 ro, vec3 rd, inout float tn, inout float tf, inout vec3 nn, inout vec3 nf){
  float dn = dot(n, rd), ds = d - dot(n, ro);
  if (dn < -1e-6){ float t = ds / dn; if (t > tn){ tn = t; nn = n; } }
  else if (dn > 1e-6){ float t = ds / dn; if (t < tf){ tf = t; nf = n; } }
  else if (ds < 0.) tn = 1e9;
}
// 팔각으로 깎은 보석: 위쪽 여덟 면, 아래쪽 여덟 면, 꼭대기의 평평한 면
void gem(vec3 ro, vec3 rd, out float tn, out float tf, out vec3 nn, out vec3 nf){
  tn = -1e9; tf = 1e9; nn = vec3(0., 1., 0.); nf = nn;
  for (int k = 0; k < 8; k++){
    float ph = float(k) * .7853982;
    clipP(vec3(cos(ph) * HC, AP, sin(ph) * HC) / LC, DC, ro, rd, tn, tf, nn, nf);
    ph += .3926991;
    clipP(vec3(cos(ph) * HP, -AP, sin(ph) * HP) / LP, DP, ro, rd, tn, tf, nn, nf);
  }
  clipP(vec3(0., 1., 0.), TB, ro, rd, tn, tf, nn, nf);
}
float gemEdge(vec3 p, vec3 nn){
  float e = 1e9;
  for (int k = 0; k < 8; k++){
    float ph = float(k) * .7853982;
    vec3 n = vec3(cos(ph) * HC, AP, sin(ph) * HC) / LC;
    if (dot(n, nn) < .999) e = min(e, DC - dot(n, p));
    ph += .3926991;
    n = vec3(cos(ph) * HP, -AP, sin(ph) * HP) / LP;
    if (dot(n, nn) < .999) e = min(e, DP - dot(n, p));
  }
  if (nn.y < .999) e = min(e, TB - p.y);
  return e;
}
vec3 rotY(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(c * v.x + s * v.z, v.y, -s * v.x + c * v.z); }
vec3 envH(vec3 d){
  vec3 c = vec3(.008, .016, .03);
  c += vec3(.25, .8, 1.) * pow(max(d.y, 0.), 3.) * .22;
  c += vec3(1., .7, .35) * pow(max(dot(d, normalize(vec3(.6, .25, -.5))), 0.), 10.) * 1.8;
  c += vec3(.3, .9, 1.) * pow(max(dot(d, normalize(vec3(-.7, .15, -.3))), 0.), 12.) * 1.5;
  c += vec3(.1, .4, .55) * (1. - ss(0., .22, abs(d.y + .12))) * .4;
  return c;
}
vec3 stone(vec3 ro, vec3 rd, out float hit){
  hit = 0.;
  float sc = SC * (1. + .025 * uBeat);
  vec3 o = rotY((ro - vec3(0., CY * SC, 0.)) / sc, uYaw), d = rotY(rd, uYaw);
  float tn, tf; vec3 nn, nf;
  gem(o, d, tn, tf, nn, nf);
  if (tn > tf || tf < 0.) return vec3(0.);
  hit = 1.;
  vec3 gold = vec3(1., .76, .4);
  if (tn < 0.) return gold * (2.5 + 3. * uBeat);
  vec3 pe = o + d * tn;
  float cosi = max(dot(-d, nn), 0.), F = .05 + .95 * pow(1. - cosi, 5.);
  vec3 col = envH(rotY(reflect(d, nn), -uYaw)) * F;
  vec3 ri = refract(d, nn, 1. / 1.55);
  float t2n, t2f; vec3 n2n, n2f;
  gem(pe + ri * .002, ri, t2n, t2f, n2n, n2f);
  float len = max(t2f, 0.);
  vec3 c0 = vec3(0., -.9, 0.);
  float tc = clamp(dot(c0 - pe, ri), 0., len);
  float dc = length(pe + ri * tc - c0);
  float core = exp(-dc * dc * (1.5 - .6 * uBeat)) * (.55 + 1.2 * uBeat);
  vec3 ex = refract(ri, -n2f, 1.55);
  vec3 through = dot(ex, ex) < .01 ? envH(rotY(reflect(ri, -n2f), -uYaw)) : envH(rotY(ex, -uYaw));
  vec3 tint = exp(-len * vec3(.42, .12, .08));
  vec3 nw = rotY(nn, -uYaw);
  col += (1. - F) * (through * tint * 2.2 + gold * core + vec3(.04, .2, .27) * tint * (.4 + 1.2 * pow(max(dot(nw, normalize(vec3(-.5, .5, -.7))), 0.), 2.)));
  col += vec3(.6, .95, 1.) * pow(max(dot(rotY(n2f, -uYaw), normalize(vec3(.4, .7, -.5))), 0.), 6.) * .3 * tint;
  col += vec3(.7, .97, 1.) * (1. - ss(0., .03, gemEdge(pe, nn))) * (.45 + 1.2 * uBeat);
  return col;
}
void main(){
  vec2 p = (gl_FragCoord.xy - uCtr) * uS + uShake;
  vec3 ro = uCam;
  vec3 fw = normalize(uTgt - uCam);
  vec3 rt = normalize(cross(vec3(0., 1., 0.), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(fw * uFoc + rt * p.x + up * p.y);
  float hit;
  vec3 gold = vec3(1., .76, .4);
  vec3 col = stone(ro, rd, hit);
  if (hit < .5){
    if (rd.y < -1e-4){
      float tg = -ro.y / rd.y; vec3 pos = ro + rd * tg; vec2 x = pos.xz; float rr = length(x);
      float aX = tg * .004 + .003, aZ = aX / max(-rd.y, .03), aM = max(aX, min(aZ, 1.5));
      float gl = max(gridLine(x.x, 2., .02, aX), gridLine(x.y, 2., .02, aZ)) * .2 + max(gridLine(x.x + 8., 16., .06, aX), gridLine(x.y + 8., 16., .06, aZ)) * .7;
      gl += (lineCov(abs(rr - 14.), .1, aM) + lineCov(abs(rr - 22.), .07, aM) + lineCov(abs(rr - 40.), .07, aM)) * 1.1;
      float an = atan(x.y, x.x + 1e-6) / TAU * 64.;
      gl += lineCov(abs(fract(an) - .5) * rr * TAU / 64., .05, aM) * step(14., rr) * step(rr, 22.) * .7;
      float rp = 0.;
      for (int i = 0; i < 7; i++){ float ag = uRip[i]; if (ag < 0.) continue; rp += exp(-pow((rr - ag * 46.) / (1.5 + ag * 2.5), 2.)) * exp(-ag * 1.1); }
      col = vec3(.003, .006, .014) + vec3(.3, .85, 1.) * (gl * (.5 + 4. * rp) + rp * .12);
      col += gold * (1. + 2.5 * uBeat) * 50. / (rr * rr + 50.) * .45;
      float h2;
      vec3 rc = stone(pos, vec3(rd.x, -rd.y, rd.z), h2);
      float fr = .06 + .94 * pow(1. - max(-rd.y, 0.), 5.);
      col += rc * h2 * (.25 + .6 * fr);
      col = mix(col, vec3(.01, .035, .055), 1. - exp(-tg * .006));
    } else {
      col = vec3(.004, .01, .02) + vec3(.02, .07, .1) * exp(-rd.y * 5.) * (1. + uBeat);
    }
  }
  for (int i = 0; i < 2; i++){
    float sc = i == 0 ? 7. : 13.;
    vec2 e = p * sc + vec2(0., -uTh * (i == 0 ? .5 : .3));
    e.x += sin(e.y * .7 + float(i) * 2.) * .35;
    vec2 id = floor(e); vec2 f = fract(e) - .5; vec2 hh = h22(id + float(i) * 31.);
    float on = step(.72, h21(id * 1.7 + 3.));
    col += mix(vec3(.55, .95, 1.), gold, step(.5, hh.y)) * (1. - ss(0., .06, length(f - (hh - .5) * .6))) * on * (.4 + .6 * sin(uTh * 2. + hh.x * 20.)) * (.5 + uBeat) * (i == 0 ? .7 : .4) * (1. - ss(.25, .8, length(p - vec2(0., .1))));
  }
  gl_FragColor = vec4(enc(col) + dith(), 1.);
}
`;

/* ---------- 3막: 성벽 너머 또 성벽. 올라가는 쇠살문 아래로 성문을 연달아 뚫고 달린다 ---------- */
const GATES = `
uniform float uPhase, uU, uYaw, uRoll;
uniform vec2 uCamXY;
const float S = 7., D = 1.7, AW = 1.9, AH = 2.5, WT = 7.6;
float arch(vec2 q){ return q.y < AH ? abs(q.x) - AW : length(vec2(q.x, q.y - AH)) - AW; }
vec3 glowC(){ return mix(vec3(.25, .7, 1.), vec3(.9, 1., 1.), uU); }
// 성벽의 앞면: 다듬은 돌, 아치 둘레의 테, 횃불, 깃발
vec3 wallCol(vec2 q, float gi, float t, float a0, float wz){
  float ax = abs(q.x), aa = t * .0035 + .004;
  float row = floor(q.y / .62);
  float xo = q.x / 1.24 + mod(row, 2.) * .5 + h11(gi) * 3.;
  vec2 bf = vec2(fract(xo), fract(q.y / .62));
  float bid = h21(vec2(floor(xo), row) + gi * 7.);
  float edge = min(min(bf.x, 1. - bf.x) * 1.24, min(bf.y, 1. - bf.y) * .62);
  vec3 st = vec3(.085, .08, .092) * (.55 + .6 * bid);
  if (a0 < .55){
    float j = q.y < AH ? fract(q.y / .5) * .5 : fract(atan(q.y - AH, q.x) / (PI / 9.)) * (PI / 9.) * (AW + a0);
    float jw = q.y < AH ? .5 : (PI / 9.) * (AW + a0);
    edge = min(min(j, jw - j), min(a0, .55 - a0));
    st = vec3(.14, .13, .135) * (.75 + .4 * h11(floor(q.y < AH ? q.y / .5 + sign(q.x) * 20. : atan(q.y - AH, q.x) / (PI / 9.)) + gi));
  }
  st *= .6 + .7 * fbm(q * 3.1 + gi * 5.);

/* ---------- 초월 2막: 하늘에 닿는 봉인된 대문. 고동칠 때마다 조금씩 열리고, 틈으로 빛이 쏟아진다 ---------- */
const DOOR = `
uniform vec3 uCam, uTgt;
uniform float uFoc, uTheta, uBeat, uTh;
const float DW = 8., DH = 36.;
float opening(vec2 q){ return max(abs(q.x) - DW, q.y - DH); }
vec3 lightC(){ return vec3(1., .93, .8); }
// 왼쪽 문짝(경첩은 x=-DW). 맞으면 거리, 아니면 -1. uv.x 는 경첩에서 잰 거리.
float leaf(vec3 ro, vec3 rd, out vec2 uv){
  float c = cos(uTheta), s = sin(uTheta);
  vec3 h = vec3(-DW, 0., 0.), d = vec3(c, 0., s), n = vec3(-s, 0., c);
  float dn = dot(rd, n); uv = vec2(0.);
  if (abs(dn) < 1e-5) return -1.;
  float t = dot(h - ro, n) / dn;
  if (t <= 0.) return -1.;
  vec3 P = ro + rd * t; float u = dot(P - h, d), xc = -DW + u;
  if (u < 0. || u > DW || P.y < 0. || P.y > DH + 14.) return -1.;
  uv = vec2(u, P.y); return t;
}
vec3 leafCol(vec2 uv, float t){
  float u = uv.x, y = uv.y, xc = DW - u;                      // xc: 닫혔을 때 문 가운데 틈에서 잰 거리
  float aa = t * .004 + .01;
  vec3 wood = vec3(.07, .045, .03) * (.6 + .5 * h11(floor(u))) * (.7 + .5 * fbm(vec2(u * 6., y * .5)));
  wood *= 1. - .5 * lineCov(abs(fract(u) - .5) - .47, .03, aa);
  float band = step(abs(mod(y, 9.) - 4.5), .55) + step(u, .5) + step(DW - .4, u);
  vec3 iron = vec3(.045, .047, .055) * (.7 + .6 * fbm(uv * 2.));
  vec3 col = mix(wood, iron, min(band, 1.));
  vec2 sg = vec2(fract(u / 2.) - .5, fract(y / 3.) - .5) * vec2(2., 3.);
  float stud = 1. - ss(.16, .22, length(sg));
  col = mix(col, vec3(.16, .15, .14), stud);
  // 두 문짝에 걸쳐 새겨진 봉인: 문이 열리면 반으로 갈라진다
  vec2 e = vec2(xc, y - 21.); float er = length(e), ea = atan(e.y, e.x + 1e-5);
  float seal = lineCov(min(min(abs(er - 5.6), abs(er - 4.9)), abs(er - 2.2)), .07, aa);
  seal += lineCov(abs(fract(ea / TAU * 8. + .5) - .5) * er * TAU / 8., .06, aa) * step(2.2, er) * step(er, 4.9);
  seal += lineCov(abs(fract(ea / TAU * 48.) - .5) * er * TAU / 48., .04, aa) * step(4.9, er) * step(er, 5.6);
  float nearGap = exp(-xc * .42);
  vec3 lit = lightC() * (.03 + (.5 + 1.6 * uBeat) * nearGap * ss(0., .08, uTheta + .02));
  col = col * (vec3(.16, .19, .28) + vec3(1., .5, .18) * 1.2 * exp(-u * .35) + lit) + (vec3(.5, .9, 1.) * (.4 + 1.1 * uBeat) + lightC() * nearGap * .6) * seal * .9;
  col += lightC() * exp(-xc * 3.) * (.3 + 1.2 * ss(0., .1, uTheta));

vec3 wallCol(vec2 q, float t){
  float aa = t * .004 + .01, a0 = opening(q);
  float row = floor(q.y / 2.6), xo = q.x / 5.2 + .5 * mod(row, 2.);
  vec2 bf = vec2(fract(xo), fract(q.y / 2.6));
  float edge = min(min(bf.x, 1. - bf.x) * 5.2, min(bf.y, 1. - bf.y) * 2.6);
  vec3 st = vec3(.075, .07, .078) * (.6 + .5 * h21(vec2(floor(xo), row))) * (.65 + .6 * fbm(q * .7));
  if (a0 < 3.6){

    float j = q.y < DH ? fract(q.y / 2.) * 2. : fract(q.x / 2.) * 2.;
    float jw = 2.;
    edge = min(min(j, jw - j), min(fract(a0 / 1.2), 1. - fract(a0 / 1.2)) * 1.2);

void main(){
  vec2 p = (gl_FragCoord.xy - uCtr) * uS + uShake;

  vec3 fw = normalize(uTgt - uCam);

/* ---------- 무한: 상자 속의 성, 성 속의 상자. 위에서 내려다본 작은 세계가 끝없이 겹쳐 있다 ---------- */
const NEST = `
uniform float uZoom, uRot, uTw, uOuter, uInner, uBeat, uGold, uVar, uOpen, uDim, uCen, uTilt;
uniform float uGrow, uLit, uLitK, uBio, uHK, uSunI, uLan, uLanT, uLanS;

uniform float uShock[4];
const float SZ = 6., LS = 1.7917595;
float mn(vec2 p){ return max(abs(p.x), abs(p.y)); }
float sdB2(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
// 높이와 재질. 0 땅 1 나무 2 놋쇠 3 돌 4 지붕 5 뚜껑. det 이 0 이면 집과 성가퀴 같은 잔 것은 건너뛴다.
float hmap(vec2 p, float lid, float det, out float mat){
  float m = mn(p), h = 0.; mat = 0.;
  if (m > .84){ mat = min(abs(p.x), abs(p.y)) > .76 ? 2. : 1.; return 1.35 - .2 * ss(.96, 1., m) - .15 * (1. - ss(.84, .86, m)); }
  if (lid > .5){ mat = 5.; return 1.22; }
  float dw = abs(sdB2(p, vec2(.56))) - .03;
  if (dw < 0.){ h = .55 + .09 * det * step(.5, fract((abs(p.x) > abs(p.y) ? p.y : p.x) * 22.)) * step(-.012, dw); mat = 3.; }
  float dt = length(abs(p) - .56) - .08;
  if (dt < 0.){ h = .9 + .4 * (-dt / .08); mat = 4.; }

    if (top > -1.5) d = min(d, crenel(sdBox3(p - vec3(0., hgt + .1, 0.), vec3(w + .22, .5, w + .22)), p.xz, top, .7));
  } else if (dm.z < 1.5){
    d = sdCyl(p, w, hgt);
    if (top > -1.5){
      d = min(d, sdCyl(p - vec3(0., hgt - .35, 0.), w + .22, .55));
      d = min(d, sdCone(p - vec3(0., hgt + .2, 0.), w + .4, w * 1.8) * .9);
    }
  } else {
    float hb = hgt * 1.05, h2t = hgt * 1.5;
    d = sdBox3(p - vec3(0., hb * .5, 0.), vec3(w, hb * .5, w));
    if (abs(p.y - hb) < 1.5) d = min(d, crenel(sdBox3(p - vec3(0., hb + .1, 0.), vec3(w + .25, .5, w + .25)), p.xz, p.y - hb, .8));
    vec3 qc = vec3(abs(p.x) - w, p.y, abs(p.z) - w);
    d = min(d, sdCyl(qc, .8, hb + 1.8));
    d = min(d, sdCone(qc - vec3(0., hb + 1.8, 0.), 1.05, 2.3) * .9);
    d = min(d, sdBox3(p - vec3(0., (hb + h2t) * .5, 0.), vec3(1.7, (h2t - hb) * .5, 1.7)));
    if (abs(p.y - h2t) < 1.5) d = min(d, crenel(sdBox3(p - vec3(0., h2t + .1, 0.), vec3(1.92, .5, 1.92)), p.xz, p.y - h2t, .64));
    d = min(d, sdCone(p - vec3(0., h2t + .3, 0.), 1.5, hgt * .2) * .9);
  }
  return d;
}
float walls(vec3 p, vec2 id, float g){
  float lane = 1. - step(.1, abs(abs(id.x) - 1.));
  float hw = (2.6 + lane * 1.6) * ez(g);
  float top = p.y - hw;
  float wzp = max(lane, step(.45, h21(id + 91.3))) * hasT(id + vec2(0., 1.));
  float wzm = max(lane, step(.45, h21(id + vec2(0., -1.) + 91.3))) * hasT(id + vec2(0., -1.));
  float wxp = step(.5, h21(id * 2.1 + 7.)) * hasT(id + vec2(1., 0.));
  float wxm = step(.5, h21((id + vec2(-1., 0.)) * 2.1 + 7.)) * hasT(id + vec2(-1., 0.));
  float d = 1e3;
  float z0 = -4.05 * wzm, z1 = 4.05 * wzp;
  if (z1 - z0 > .1){
    float dz = sdBox3(p - vec3(0., hw * .5, (z0 + z1) * .5), vec3(.32, hw * .5, (z1 - z0) * .5));
    if (top > -1.) dz = max(dz, -max(abs(mod(p.z + .4, .8) - .4) - .2, -.4 - top));
    d = dz;
  }
  float x0 = -4.05 * wxm, x1 = 4.05 * wxp;
  if (x1 - x0 > .1){
    float dx = sdBox3(p - vec3((x0 + x1) * .5, hw * .5, 0.), vec3((x1 - x0) * .5, hw * .5, .32));
    if (top > -1.) dx = max(dx, -max(abs(mod(p.x + .4, .8) - .4) - .2, -.4 - top));
    d = min(d, dx);
  }
  return d;
}
// 첨탑을 겹겹이 두른 둥근 성벽. 큰길이 지나는 네 곳에는 문이 뚫려 있다.
float ringR(float rs){ return 62. + 56. * max(floor((rs - 62.) / 56. + .5), 0.); }
float ringWall(vec3 p, float rs){
  float R = ringR(rs);
  float hw = 8.5 * ez(growR(R));
  if (hw < .01) return 1e3;
  vec2 dd = vec2(abs(rs - R) - .9, p.y - hw);
  float d = min(max(dd.x, dd.y), 0.) + length(max(dd, 0.));
  if (dd.y > -1.2 && dd.x < 1.5){
    float arc = atan(p.z, p.x + 1e-6) * R;
    d = max(d, -max(abs(mod(arc + .7, 1.4) - .7) - .35, -.5 - dd.y));
  }
  return max(d, -max(min(abs(p.x), abs(p.z)) - 3.2, p.y - 6.));
}
float spire(vec3 p){
  p /= SS;
  p.y += (1. - uSpireE) * 54.;
  float d = sdBox3(p - vec3(0., 4.5, 0.), vec3(6., 4.5, 6.));
  d = min(d, sdBox3(p - vec3(0., .8, 0.), vec3(6.7, .8, 6.7)));
  if (abs(p.y - 9.) < 1.6) d = min(d, crenel(sdBox3(p - vec3(0., 9.15, 0.), vec3(6.35, .55, 6.35)), p.xz, p.y - 9., 1.2));
  vec3 q = vec3(abs(p.x) - 6., p.y, abs(p.z) - 6.);
  d = min(d, sdCyl(q, 1.7, 13.));
  d = min(d, sdCyl(q - vec3(0., 12.4, 0.), 2., .7));
  d = min(d, sdCone(q - vec3(0., 13.1, 0.), 2.2, 4.4) * .9);
  d = min(d, sdBox3(p - vec3(0., 14.5, 0.), vec3(4., 5.5, 4.)));
  if (abs(p.y - 20.) < 1.6) d = min(d, crenel(sdBox3(p - vec3(0., 20.15, 0.), vec3(4.35, .55, 4.35)), p.xz, p.y - 20., 1.));
  vec3 q2 = vec3(abs(p.x) - 4., p.y, abs(p.z) - 4.);
  d = min(d, sdCyl(q2 - vec3(0., 15.5, 0.), .95, 7.));
  d = min(d, sdCone(q2 - vec3(0., 22.5, 0.), 1.25, 2.8) * .9);
  d = min(d, sdCyl(p - vec3(0., 20., 0.), 2.9, 14.));
  d = min(d, sdCyl(p - vec3(0., 26.6, 0.), 3.15, .5));
  d = min(d, sdCyl(p - vec3(0., 33., 0.), 3.7, 1.5));
  d = min(d, sdCyl(p - vec3(0., 34., 0.), 1.75, 8.));
  d = min(d, sdCyl(p - vec3(0., 41.4, 0.), 2.2, .7));
  d = min(d, sdCone(p - vec3(0., 42., 0.), 2.4, 10.) * .9);
  return d * SS;
}
// 돌려주는 값은 칸 경계를 넘지 않는 걸음, gD 는 실제 거리(아래쪽 한계)
float mapCity(vec3 p){
  float rs = length(p.xz);
  float d = rs < 46. ? spire(p) : rs - 30.;
  gM = 1.;
  float hb = hbound(rs);
  if (p.y > hb + 1.){ d = min(d, (p.y - hb) / 1.06); gD = d; return d; }
  float dr = ringWall(p, rs);
  if (dr < d){ d = dr; gM = 2.; }
  vec2 id = floor(p.xz / C + .5);
  vec2 lc = p.xz - id * C;
  vec2 bd = (C * .5 - lc * sign(gRd.xz)) / (abs(gRd.xz) + 1e-5);
  float tb = min(bd.x, bd.y) + .02;
  if (hasT(id) > .5){
    float g = growR(length(id * C));
    if (g > .001){
      vec3 q = vec3(lc.x, p.y, lc.y);
      float dc = tower(q, id, g);
      if (p.y < 4.8) dc = min(dc, walls(q, id, g));
      if (dc < d){ d = dc; gM = 0.; }
    }
  }
  gD = d;
  return min(d, tb);
}
float sdS(vec3 p){ mapCity(p); return gD; }
vec3 nrm(vec3 p, float t){
  vec2 e = vec2(1., -1.) * (.003 + .0007 * t);
  return normalize(e.xyy * sdS(p + e.xyy) + e.yyx * sdS(p + e.yyx) + e.yxy * sdS(p + e.yxy) + e.xxx * sdS(p + e.xxx));
}

vec3 horCol(vec3 rd){
  vec2 h = normalize(rd.xz + vec2(1e-5));
  float az = max(h.y, 0.);
  vec3 night = mix(vec3(.012, .04, .08), vec3(.03, .1, .15), az);
  vec3 dawn = mix(vec3(.2, .09, .3), vec3(1.2, .52, .2), pow(az, 4.));
  return mix(night, dawn, uDawn * (.25 + .75 * az * az));
}
vec3 sunDir(){ return normalize(vec3(0., -.05 + .12 * uDawn, 1.)); }
// 빛기둥이 닿는 하늘의 은하
vec3 galaxy(vec3 rd){
  vec3 gc = vec3(0., .848, .53);
  vec3 gx = vec3(1., 0., 0.), gy = cross(gc, gx);
  float cz = dot(rd, gc);
  if (cz < .15) return vec3(0.);
  vec2 g = vec2(dot(rd, gx), dot(rd, gy)) / cz;
  g = rot(-.5) * g; g.y *= 2.1;
  float r = length(g) / .78 + 1e-4;
  float a = atan(g.y, g.x + 1e-6);
  float sw = a - log(r + .03) * 2.7 + uT * .07;
  float arms = pow(.5 + .5 * cos(sw * 2.), 2.);
  float n = fbm(g * 7. + 3.), n2 = fbm(g * 15. - 4.);
  float disk = exp(-r * r * 1.7);
  float dust = 1. - .7 * ss(.45, .75, n2) * (1. - arms * .6);
  vec3 col = mix(vec3(.3, .42, 1.), vec3(.75, .5, 1.), n) * disk * (.07 + arms * .55) * (.4 + n) * dust;
  col += vec3(1., .45, .8) * disk * arms * pow(n, 3.) * 1.1;
  col += vec3(1., .9, .75) * (exp(-r * r * 150.) * .9 + exp(-r * r * 16.) * .14);
  vec2 sq = g * 70.; vec2 si = floor(sq); vec2 sf = fract(sq) - .5; vec2 sh = h22(si);
  col += vec3(.9, .95, 1.) * (1. - ss(0., .13, length(sf - (sh - .5) * .6))) * step(.5, sh.x) * disk * (.5 + arms) * 1.2;
  return col * ss(.15, .45, cz);
}
vec3 aurora(vec3 rd){
  if (rd.y < .06) return vec3(0.);
  vec3 col = vec3(0.);
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    vec2 pl = rd.xz / rd.y * (1. + fi * .14);
    float bend = sin(pl.x * .55 + uT * .1 + sin(pl.y * .4 + uT * .06) * 1.2) * .55 + sin(pl.x * 1.3 - uT * .13) * .15;
    float d = pl.y - 2.1 - bend;
    float rib = exp(-d * d * 5.);
    float rays = .45 + .55 * vnoise(vec2(pl.x * 6. + bend * 2., uT * .35 + fi * .1));
    col += mix(vec3(.12, 1., .6), vec3(.5, .3, 1.), fi / 4.) * rib * rays * (1. - fi * .13);
  }
  return col * .2 * ss(.06, .25, rd.y) * ss(.12, .45, abs(rd.x));
}
vec3 skyC(vec3 rd){
  float y = max(rd.y, 0.);
  vec3 zen = mix(vec3(.003, .005, .02), vec3(.014, .02, .07), uDawn);
  vec3 col = mix(horCol(rd), zen, 1. - exp(-y * 3.2));
  vec3 sdr = sunDir();
  float sd = max(dot(rd, sdr), 0.);
  col += vec3(1.3, .62, .25) * (pow(sd, 24.) * .55 + pow(sd, 300.) * 2.5) * uDawn;
  float sf = ss(.02, .3, y) * (1. - .5 * uDawn);
  vec3 q = rd * 30.; vec3 id = floor(q); vec3 f = fract(q) - .5; vec3 hh = h33(id);
  float tw = .7 + .3 * sin(uT * (2. + hh.x * 5.) + hh.y * 40.);
  col += (1. - ss(0., .1, length(f - (hh - .5) * .7))) * pow(hh.z, 5.) * 3. * tw * sf * mix(vec3(.7, .85, 1.), vec3(1., .85, .8), hh.x);
  q = rd * 67. + 5.; id = floor(q); f = fract(q) - .5; hh = h33(id);
  col += (1. - ss(0., .14, length(f - (hh - .5) * .7))) * pow(hh.z, 8.) * 1.8 * sf * vec3(.8, .9, 1.);
  // 높은 구름: 빛기둥이 둥글게 뚫어 놓았고, 뚫린 가장자리가 빛을 받는다
  if (uGal > 0. && rd.y > .03){
    float tcl = (230. - uCam.y) / rd.y;
    vec2 pl = uCam.xz + rd.xz * tcl;
    float dr = length(pl);
    float n = fbm(pl * .006 + vec2(uT * .012, 0.)), n2 = fbm(pl * .019 - 3.);
    float R = 20. + 110. * uGal;
    float dens = ss(.3, .68, n * .75 + n2 * .4) * ss(R * .8, R * 1.3, dr + (n2 - .5) * 50.) * exp(-tcl * .0013) * uGal;
    float rim = exp(-max(dr - R, 0.) / 55.);
    float az = pow(max(normalize(rd.xz + 1e-5).y, 0.), 2.);
    vec3 lit = vec3(.035, .05, .1) + vec3(.5, .9, 1.) * rim * uBeam * 1.1 + mix(vec3(.35, .14, .3), vec3(1.3, .6, .25), az) * uDawn * .6 * (.4 + n2);
    col = mix(col, lit, dens * .92);
  }
  if (uAur > 0.) col += aurora(rd) * uAur;
  // 새벽빛을 받은 낮은 구름 띠
  if (uDawn > 0. && rd.y > .01){
    vec2 pl = rd.xz / (rd.y + .08);
    float cl = fbm(vec2(pl.x * .35 + uT * .01, pl.y * .09) + 4.);
    float band = ss(.5, .78, cl) * (1. - ss(.08, .42, rd.y)) * ss(.0, .06, rd.y);
    vec3 lit = mix(vec3(.5, .2, .45), vec3(1.5, .7, .3), pow(max(dot(normalize(rd.xz + 1e-5), normalize(sdr.xz)), 0.), 3.));
    col = mix(col, lit, band * uDawn * .55);
  }
  return col;
}
// 빛기둥과 그 둘레를 감아 오르는 두 가닥
float beamAt(vec3 ro, vec3 rd, float tmaxv, float wide){
  vec2 o = ro.xz, dv = rd.xz;
  float dl = max(length(dv), 1e-4);
  float tb = -dot(o, dv) / (dl * dl);
  float yb = ro.y + rd.y * tb;
  float sdb = (o.x * dv.y - o.y * dv.x) / dl;
  float vis = step(0., tb) * step(tb, tmaxv) * ss(uApexY - 1., uApexY + 5., yb);
  float pul = .82 + .18 * sin(yb * .1 - uT * 9.);
  float core = .5 * wide / (sdb * sdb + .5 * wide) * 2.4 + 14. / (sdb * sdb + 14.) * .16;
  float hr = 2.2 + .035 * max(yb - uApexY, 0.), ph = yb * .32 - uT * 5.;
  float h1 = sdb - hr * cos(ph), h2 = sdb + hr * cos(ph);
  float helix = (.12 / (h1 * h1 + .12) + .12 / (h2 * h2 + .12)) * .55 * (1. - ss(40., 150., yb - uApexY));
  return (core * pul + helix) * vis;
}
// 빛기둥을 감싸고 천천히 도는 세 개의 큰 고리(1막의 문양이 하늘에서 다시 나타난다)
vec3 heavenRings(vec3 ro, vec3 rd, float tmaxv){
  vec3 c = vec3(0., uApexY + 14., 0.), acc = vec3(0.);
  for (int i = 0; i < 3; i++){
    vec3 n = uRn[i];
    float R = (24. + 13. * float(i)) * uRing;
    float dn = dot(rd, n);
    float tp = dot(c - ro, n) / (abs(dn) < 1e-3 ? 1e-3 : dn);
    vec3 Q = ro + rd * clamp(tp, 0., 900.);
    vec3 P = c + R * normalize(Q - c - n * dot(Q - c, n) + 1e-4);
    float tc = max(dot(P - ro, rd), 0.);
    Q = ro + rd * tc;
    P = c + R * normalize(Q - c - n * dot(Q - c, n) + 1e-4);
    tc = max(dot(P - ro, rd), 0.);
    float d = length(P - ro - rd * tc);
    vec3 u = normalize(cross(n, vec3(.3, .1, .9)));
    float ang = atan(dot(P - c, cross(n, u)), dot(P - c, u)) / TAU + .5;
    float w = .16 + tc * .0016;
    float dash = .55 + .45 * step(.5, fract(ang * (36. + 12. * float(i)) + uT * .05));
    float g = (w * w / (d * d + w * w)) * dash + .9 / (d * d + .9) * .06;
    vec3 rc = i == 0 ? vec3(.5, .95, 1.) : (i == 1 ? vec3(1., .85, .55) : vec3(.8, .6, 1.));
    acc += rc * g * step(tc, tmaxv) * 1.5;
  }
  return acc * step(.01, uRing);
}
vec3 shadeG(vec3 pos, vec3 rd, float t){
  vec2 x = pos.xz;
  vec3 cy = vec3(.3, .85, 1.);
  float aX = t * .005 + .003, aZ = aX / max(-rd.y, .03), aM = max(aX, min(aZ, 1.5));
  float gl = max(gridLine(x.x, 2., .02, aX), gridLine(x.y, 2., .02, aZ)) * .2;
  float mj = max(gridLine(x.x + 4., 8., .05, aX), gridLine(x.y + 4., 8., .05, aZ));
  gl += mj * (.8 + 1.6 * pow(.5 + .5 * sin(length(x) * .16 + uT * 2.6), 12.) * uBeam);
  vec2 id = floor(x / C + .5); vec2 lc = x - id * C;
  float rr = length(x);
  if (hasT(id) > .5){
    float g = growR(length(id * C));
    vec4 dm = towerDim(id);
    float df = abs(dm.z - 1.) < .5 ? length(lc) - dm.y : max(abs(lc.x), abs(lc.y)) - dm.y;
    float fp = lineCov(abs(df), .05, aM) * 1.3 + step(df, 0.) * (.1 + lineCov(min(abs(lc.x - lc.y), abs(lc.x + lc.y)) * .707, .025, aM) * .5);
    gl += fp * (1. - ez(g) * .75);
  } else if (rr > PLAZA - 4.){
    float ax = abs(id.x) < .5 ? x.x : x.y, az = abs(id.x) < .5 ? x.y : x.x;
    gl += lineCov(abs(ax), .05, aM) * step(.5, fract(az / 4.)) * .9 + lineCov(abs(abs(ax) - 2.6), .03, aM) * .5;
  }
  if (rr < PLAZA + 2.){
    gl += (lineCov(abs(rr - 30.), .08, aM) + lineCov(abs(rr - 35.), .06, aM)) * 1.1;
    float an = atan(x.y, x.x + 1e-6) / TAU * 48.;
    gl += lineCov(abs(fract(an) - .5) * rr * TAU / 48., .04, aM) * step(30., rr) * step(rr, 35.) * .8;
  }
  float R = ringR(rr);
  gl += lineCov(abs(abs(rr - R) - .9), .05, aM) * (1.4 - ez(growR(R)));
  float Rw = (uGrow - 1.) * 26.;
  float wf = exp(-pow((rr - Rw) / 3.2, 2.)) * step(1., uGrow);
  vec3 col = vec3(.003, .006, .016);
  col += cy * (gl * (.55 + 5. * wf) + wf * .1);
  // 매끈한 바닥에 비친 하늘과 빛기둥, 문에서 흘러나온 빛
  vec3 rf = vec3(rd.x, -rd.y, rd.z);
  float fr = pow(1. - max(-rd.y, 0.), 5.);
  float sd = max(dot(rf, sunDir()), 0.);
  col += (horCol(rf) + vec3(1.3, .62, .25) * pow(sd, 60.) * 1.6 * uDawn) * fr * .75;
  col += vec3(.6, .95, 1.) * beamAt(pos, rf, 1e4, 4.) * uBeam * (.2 + .8 * fr);
  float gz = 6.7 * SS, dg = max(-x.y - gz, 0.);
  col += vec3(.45, .9, 1.) * uHeart * exp(-abs(x.x) * .16) * 12. / (dg * dg * .006 + 12.) * step(x.y, -gz) * .55;
  return col;
}
vec3 shadeB(vec3 pos, vec3 n, vec3 rd, float t, float mat){
  vec3 dawnC = mix(vec3(.75, .28, .5), vec3(1.25, .62, .28), uDawn);
  float fres = pow(1. - max(dot(n, -rd), 0.), 3.);
  vec3 col = vec3(.008, .012, .028) * (.85 + .5 * n.y);
  col += vec3(.02, .045, .085) * max(n.y, 0.) * (.5 + uGal + uBeam);
  col += vec3(.1, .32, .4) * exp(-max(pos.y, 0.) * .3) * .22 * (1. - abs(n.y));
  col += horCol(reflect(rd, n)) * fres * .9;
  col += dawnC * max(dot(n, sunDir()), 0.) * uDawn * .6;
  vec3 la = vec3(0., max(pos.y, uApexY), 0.) - pos;
  float ld = length(la); la /= ld;
  col += vec3(.45, .9, 1.) * max(dot(n, la), 0.) * uBeam * 110. / (ld * ld + 500.);
  if (mat < .5){
    vec2 cid = floor(pos.xz / C + .5); vec2 lc = pos.xz - cid * C;
    if (abs(n.y) < .5){
      // 성벽의 좁은 창
      float u = abs(n.x) > abs(n.z) ? pos.z : pos.x;
      vec2 wc = vec2(u / .9, pos.y / 1.7);
      vec2 wi = floor(wc), wf = fract(wc);
      float hh = h21(wi * 1.9 + cid * 7.3);
      float lit = step(1. - .26 * uWin, hh);
      float shape = ss(.4, .45, wf.x) * (1. - ss(.55, .6, wf.x)) * ss(.3, .36, wf.y) * (1. - ss(.72, .8, wf.y));
      vec3 wcl = mix(vec3(1., .7, .32), vec3(.6, .95, 1.), step(.8, h21(wi + 5.)));
      col += wcl * lit * shape * ss(1.5, 2.4, pos.y) * (1. - ss(90., 260., t)) * 2.2;
    } else if (n.y > .5){
      // 지붕 한가운데의 횃불
      float torch = (1. - ss(0., .34, length(lc))) * step(.35, h21(cid + 2.2)) * uWin;
      col += vec3(1.3, .62, .2) * torch * (2.2 + .8 * sin(uT * 9. + cid.x * 3.1 + cid.y * 1.7));
    }
  } else if (mat < 1.5 && abs(n.y) < .5){
    vec3 ps = pos / SS;
    float u = abs(n.x) > abs(n.z) ? ps.z : ps.x;
    vec2 wc = vec2(u / 1.5, ps.y / 2.6);

 둘레 1.5칸에 불을 붙인다.","장작더미 속에서 녹지 않고 남았다."],["상처 세는 자",4,0,["출혈","가벼움"],"출혈 중인 적을 베면 남은 출혈 피해를 한꺼번에 준다.","주인은 자기가 낸 상처를 하나도 잊지 않았다."],["충신",4,1,["버팀","막기"],"체력이 0이 되면 이 검이 대신 부러지고 체력 30으로 버틴다 (밤마다 1번).","왕 대신 칼을 맞고 부러진 검. 누군가 다시 붙여 놓았다."],["무덤 파수",4,1,["망령 베기","사냥"],"쓰러뜨린 적의 30%가 내 편 망령으로 일어나 10초 동안 싸운다.","무덤지기가 평생 쓴 검. 무덤 속 사람들이 아직 그를 따른다."],["끌어당기는 손",4,3,["긴 날","첫 타"],"찌르기 끝에 맞은 적을 내 앞으로 끌어온다.","도망치는 적을 놓친 적이 없다."],["거인의 무릎",4,2,["거인 베기","무거움"],"큰 적을 세 번 연달아 베면 무릎을 꿇려 3초 동안 받는 피해가 2배가 된다.","거인 사냥꾼들은 늘 무릎부터 노렸다."],["쌍칼 서약",4,0,["바꿔 쥐기","연격"],"다른 칸에 든 검의 각인도 함께 발동한다.","형제 기사가 하나씩 나눠 들던 검. 혼자 들어도 둘이 싸운다."],["폭풍 부르는 자",4,1,["번개","연격"],"큰 베기가 땅을 쳐서 앞쪽 부채꼴로 번개가 퍼진다.","이 검을 뽑은 날마다 비가 왔다."],["굶주린 칼",4,2,["흡혈","숫돌"],"적을 쓰러뜨리면 내구가 닳지 않고 오히려 찬다. 10초 동안 아무도 못 베면 체력을 1씩 빨아먹는다.","베지 않으면 주인을 먹는다."],["바람 가르는 깃",4,3,["날랜 발","가벼움"],"돌진을 두 번 연달아 할 수 있다.","전령이 쓰던 칼. 소식보다 칼이 먼저 도착했다."],["마지막 숨",4,1,["광기","처형"],"체력이 20% 이하면 모든 공격이 큰 베기가 된다.","다 쓰러진 뒤에야 제 힘을 낸다."],["메아리 계곡",4,1,["잔상","넓은 날"],"휘두르고 0.5초 뒤 같은 자리에 같은 베기가 한 번 더 일어난다.","계곡에서 휘두르면 한 번 더 들린다고 해서 붙은 이름."],["핏빛 맹세",4,0,["피의 값","흡혈"],"큰 베기마다 체력 5를 쓰고 피해가 2배가 된다.","피로 맹세한 자만 쥘 수 있다."],["쇠말뚝",4,2,["밀쳐내기","막기"],"큰 베기 자리에 검 그림자가 꽂혀 4초 동안 적이 지나가지 못한다.","성벽이 무너진 날, 이 검 하나가 성문을 대신했다."],["행운의 녹",4,1,["행운","마지막 일격"],"이 검이 부러지면 다음 낮 첫 뽑기의 운이 3배가 된다.","녹이 슬수록 운이 좋아진다는 미신이 있다."],["새벽 나팔",4,1,["새벽","버팀"],"밤이 30초 남으면 체력을 모두 회복하고 피해 +50%.","밤새 버틴 병사들은 이 검이 빛나면 해가 뜬다는 걸 알았다."],["늪지기",4,3,["긴 날","사냥"],"찌른 자리에 2초 동안 늪이 생겨 적이 60% 느려진다.","늪을 지키던 자의 검. 칼끝이 늘 젖어 있다."],["산 자의 몫",4,1,["가벼운 손","사냥"],"적을 쓰러뜨리면 10% 확률로 낮 뽑기 한 번이 체력 없이 된다 (최대 3번 쌓임).","죽은 자의 검을 거두던 장의사의 검."],["모래시계",4,0,["날랜 발","등 뒤"],"돌진하면 1초 동안 둘레 적이 70% 느려진다.","이 칼에 베인 자는 모두 느리게 쓰러졌다고 한다."],["무너진 왕좌",4,2,["버팀","무리 베기"],"둘레 3칸 안의 적 하나마다 받는 피해 -5% (최대 -50%).","에워싸일수록 왕은 침착했다."],["언덕을 쌓은 검",4,2,["무거움","막기"],"큰 베기마다 앞에 흙벽이 솟아 5초 동안 적을 막는다 (벽 최대 3개).","땅을 갈라 이 언덕을 쌓아 올렸다는 검."],["첫 번째 왕",4,1,["날","버팀"],"들고 있는 두 검의 각인 수치가 50% 오른다.","첫 왕국의 왕이 들던 검. 그의 기사들은 이 검 앞에서 두 배로 싸웠다."],["끝나지 않는 겨울",4,3,["서리","꿰뚫기"],"밤 동안 눈이 내려 모든 적이 20% 느려지고, 찌른 적은 1초 얼어붙는다.","이 검이 뽑혀 있는 동안 언덕에 봄이 오지 않았다."],["대화재",4,2,["불씨","넓은 날"],"휘두른 자리에 3초 동안 불길이 남는다.","한 왕국을 사흘 동안 태운 불이 이 검에서 시작됐다."],["천 명의 기사",4,1,["연격","무리 베기"],"기사 망령 3명이 따라다니며 내 베기를 따라 벤다 (피해 30%).","언덕에 잠든 기사 천 명이 이 검의 주인을 따른다."],["구름 가르는 천둥",4,1,["번개","거인 베기"],"5번째 타격마다 가장 센 적 3명에게 벼락이 떨어진다 (피해 400%).","구름을 벤 자국이 아직 하늘에 남아 있다고 한다."],["피의 강",4,0,["출혈","흡혈"],"출혈로 쓰러진 적이 피 웅덩이를 남기고, 웅덩이를 밟으면 체력이 찬다.","언덕 아래 개울이 한때 붉었던 이유."],["멈춘 순간",4,0,["날랜 발","등 뒤"],"돌진하면 1.5초 동안 나만 빼고 모두 멈춘다 (재사용 12초).","이 검을 쥔 기사는 혼자 백 명을 베고도 숨이 차지 않았다."],["거인 왕의 뼈",4,2,["거인 베기","밀쳐내기"],"큰 적을 쓰러뜨리면 10초 동안 몸이 커져 피해와 사거리 +50%.","거인 왕의 갈비뼈를 갈아 만들었다."],["영원한 파수",4,1,["막기","흡혈"],"체력이 0이 되어도 10초 동안 쓰러지지 않고, 그동안 준 피해만큼 체력을 되찾는다 (밤마다 1번).","주인은 죽은 뒤에도 사흘을 더 성문을 지켰다."],["바람의 왕",4,3,["긴 날","꿰뚫기"],"찌르기가 바람이 되어 화면 끝까지 날아가며 모두 꿰뚫는다.","찌른 자리에서 바람이 시작된다."],["망자들의 왕관",4,1,["망령 베기","사냥"],"쓰러뜨린 적이 모두 내 편 망령으로 일어난다 (최대 8).","이 검 앞에서는 죽은 자도 무릎을 꿇는다."],["부러지지 않는 맹세",4,1,["단단함","무거움"],"이 검은 부러지지 않는다. 대신 휘두를수록 무거워져 속도가 줄고 피해가 는다.","천 번을 내리쳐도 부러지지 않았다. 대신 주인이 늙었다."],["마지막 장례",4,2,["마지막 일격","숫돌"],"다른 검이 부러지면 그 검의 각인 하나를 이 검이 가져간다 (그 판 동안, 최대 4개).","부러진 검들을 묻어 주던 검. 묻은 검들의 힘을 품고 있다."],["운명 베기",4,0,["행운","가벼운 손"],"낮에 뽑은 검이 마음에 안 들면 이 검의 내구 30을 써서 다시 뽑는다 (낮마다 3번).","운명이 마음에 들지 않으면 베어 버리라고, 주인은 말했다."],["언덕의 심장",5,2,["무리 베기","날"],"휘두를 때마다 언덕에 꽂힌 검 5자루가 땅에서 솟아 둘레 적을 찌른다.","언덕 한가운데 가장 깊이 꽂힌 검. 모든 검이 이 검을 둘러싸고 있다."],["그림자 왕",5,0,["날랜 발","잔상"],"돌진한 자리에 내 그림자가 남아 5초 동안 같이 싸운다 (최대 3).","왕은 한 번도 혼자 싸운 적이 없다. 그림자가 늘 함께였다."],["겨울의 끝",5,3,["서리","처형"],"언 적이 부서질 때마다 다음 찌르기가 화면 끝까지 닿는 얼음 창이 된다.","끝나지 않는 겨울을 끝낸 검."],["꺼지지 않는 불",5,2,["불씨","무거움"],"불이 꺼지지 않는다. 불붙은 적은 쓰러질 때까지 타며 옆으로 번진다.","꺼뜨린 사람이 아무도 없다."],["백 년 전쟁",5,1,["연격","버팀"],"밤이 깊을수록 강해진다. 10초마다 피해 +5% (상한 없음).","백 년 동안 한 번도 칼집에 들어가지 않았다."],["피의 왕좌",5,1,["흡혈","광기"],"흡혈로 체력이 넘치면 넘친 만큼 보호막이 된다 (최대 100).","왕좌에 오른 자는 피를 흘리지 않았다. 남의 피로 충분했다."],["떨어진 검",5,2,["거인 베기","마지막 일격"],"큰 베기 3번마다 하늘에서 거대한 검이 떨어져 둘레 4칸을 친다.","하늘에서 떨어졌다. 떨어진 자리에 아직 구덩이가 있다."],["망각",5,3,["첫 타","꿰뚫기"],"찔린 적은 나를 잊고 3초 동안 다른 적을 공격한다.","이 검에 베인 자는 자기가 누구와 싸우는지 잊는다."],["두 번째 기회",5,1,["버팀","행운"],"밤에 쓰러지면 그 밤을 처음부터 다시 한다 (판마다 1번).","주인은 같은 밤을 두 번 살았다고 한다."],["모든 검의 어머니",5,1,["행운","가벼운 손"],"들고 있으면 낮에 뽑는 모든 검이 각인을 하나 더 달고 나온다.","언덕의 검들은 모두 이 검에서 갈라져 나왔다."],["언덕",5,2,[],"부러지지 않는다. 들면 이 판에서 뽑은 모든 검의 각인이 함께 발동한다.","언덕이 검이고, 검이 언덕이다."],["처음이자 마지막 칼",5,1,[],"밤마다 한 번, 휘두르면 화면의 모든 적이 쓰러진다.","첫 전쟁을 시작한 칼이자, 마지막 전쟁을 끝낼 칼."],["이름을 잃은 검",5,0,[],"뽑는 순간 언덕의 모든 검이 함께 뽑혀 나와 도감이 다 채워진다.","아무도 이 검의 이름을 기억하지 못한다. 뽑은 사람도."]];
/* ===== 검의 언덕 시험판 =====
   낮: 언덕에 꽂힌 검을 뽑는다. 한 번 뽑을 때마다 체력이 준다. 밤: 뽑은 검으로 버틴다. 검은 벨수록 닳아 부러진다.
   다섯 구역을 올라 정상의 언덕지기를 쓰러뜨리면 끝. 죽으면 도감만 남는다. */
{

function dex() {

// ===================== [입력] =====================
const keys = new Set(), mouse = { x: 0, y: 0, down: false, on: false }; let want = { atk: false, dash: false }, touch = false; const joy = { on: false, x: 0, y: 0, id: -1 };
const active = () => !S && !$('td').classList.contains('dx');
addEventListener('keydown', e => {
  if (!active()) { if (e.code === 'Escape') $('td').classList.remove('dx'); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

addEventListener('mouseup', () => mouse.down = false);
addEventListener('touchstart', () => { if (!touch) { touch = true; $('td').classList.add('touch'); layout(); } }, { passive: true });
const jEl = $('joy'), jK = $('joyK');
const jMove = t => { const r = jEl.getBoundingClientRect(), dx = t.clientX - r.left - r.width / 2, dy = t.clientY - r.top - r.height / 2, m = Math.hypot(dx, dy), k = Math.min(1, m / (r.width / 2)) / (m || 1); joy.x = dx * k; joy.y = dy * k; jK.style.transform = 'translate(' + joy.x * 40 + 'px,' + joy.y * 40 + 'px)'; };

let tAtk = false;
const hold = (id, dn, up) => { const el = $(id); el.addEventListener('touchstart', e => { dn(); e.preventDefault(); }, { passive: false }); el.addEventListener('touchend', e => { up && up(); e.preventDefault(); }, { passive: false }); el.addEventListener('mousedown', dn); };
hold('tA', () => { tAtk = true; want.atk = true; }, () => tAtk = false); hold('tD', () => want.dash = true); hold('tE', () => tryPull()); hold('tQ', () => swap());
function readInput() {
  let x = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) + joy.x, y = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) + joy.y;
  const inp = { x, y, atk: want.atk || mouse.down || tAtk || keys.has('Space') || keys.has('KeyJ'), dash: want.dash };

  else if (inp.atk) { let b = null, bd = 6; for (const e of G.en) { const d = Math.hypot(e.x - G.x, e.y - G.y) - e.D.r; if (d < bd) { bd = d; b = e; } } if (b) inp.aim = { x: b.x, y: b.y }; }   // 터치·키보드는 가까운 적을 향한다

}
$('bNight').onclick = startNight; $('bDex').onclick = dex; $('bDexX').onclick = () => $('td').classList.remove('dx'); $('bAdm').onclick = () => $('td').classList.toggle('adm');
$('bAgain').onclick = () => { $('td').classList.remove('ov'); newRun(); drawCards(); };
$('chAb').onclick = () => choose(0); $('chBb').onclick = () => choose(1); $('chX').onclick = () => choose(-1);   // 카드 자체는 눌러도 아무 일 없다

{ const b = $('admBody'), row = () => { const r = document.createElement('div'); r.className = 'arow'; b.appendChild(r); return r; }, btn = (r, t, f) => { const e = document.createElement('button'); e.type = 'button'; e.className = 'btn'; e.textContent = t; e.onclick = f; r.appendChild(e); return e; };
