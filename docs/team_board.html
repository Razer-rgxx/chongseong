<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검의 언덕 팀 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 게임 화면(UiKit)과 같은 세계: 검은 판, 놋쇠빛 줄, 따뜻한 글자. 한 가지 테마로 둔다.
   배치: 위에서 요약 → 팀 흐름(조직도) → 동작 20 × 팀 4 격자 → 조합 150 → 기록 */
:root {
  --bg: #0b0907;
  --panel: #15120e;
  --line: #a88f61;
  --title: #edd9a8;
  --text: #ded6c7;
  --muted: #9a9283;
  --done: #86a35f;
  --doing: #d9a447;
  --wait: #4b463f;
  --ember: #d9772b;
  --display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; }
main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 34px; }
h1, h2, h3 { font-family: var(--display); color: var(--title); font-weight: 800; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; letter-spacing: 0.01em; }
h2 { font-size: 19px; padding-bottom: 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
header { display: grid; gap: 10px; }
.summary { display: flex; flex-wrap: wrap; gap: 10px 26px; color: var(--muted); }
.summary b { color: var(--title); font-weight: 700; font-size: 18px; margin-right: 4px; }
section { display: grid; gap: 16px; }

/* 상태 표시 */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border: 1px solid currentColor; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; background: currentColor; }
.s-done { color: var(--done); }
.s-doing { color: var(--doing); }
.s-wait { color: var(--muted); }

/* 조직도: 총괄 아래로 네 팀이 차례로 */
.org { display: grid; gap: 14px; }
.lead { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; display: grid; gap: 6px; }
.flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
.team { background: var(--panel); border: 1px solid color-mix(in srgb, var(--line) 45%, transparent); padding: 14px 14px 16px; display: grid; gap: 9px; align-content: start; position: relative; }
.team + .team { border-left: none; }
.team.is-doing { border-color: var(--doing); box-shadow: inset 0 3px 0 var(--doing); }
.team.is-done { box-shadow: inset 0 3px 0 var(--done); }
.team .order { font-family: var(--display); color: var(--line); font-size: 13px; }
.who { display: flex; gap: 12px; align-items: center; }
.who svg { flex: none; width: 44px; height: 52px; image-rendering: pixelated; }
.who .model { color: var(--ember); }
.team .model { font-size: 12.5px; color: var(--muted); }
.team ul { margin: 0; padding-left: 16px; display: grid; gap: 3px; font-size: 13.5px; }
.team .files { font-size: 12px; color: var(--muted); word-break: break-all; }
.team .files code { color: var(--text); font-size: 11.5px; }
.team .note { font-size: 13px; border-top: 1px solid color-mix(in srgb, var(--line) 30%, transparent); padding-top: 8px; }
.arrow { position: absolute; right: -9px; top: 22px; width: 16px; height: 16px; background: var(--bg); border: 1px solid var(--line); transform: rotate(45deg); z-index: 2; }
.team:last-child .arrow { display: none; }

/* 동작 20 × 팀 4 */
.grid-wrap { overflow-x: auto; border: 1px solid color-mix(in srgb, var(--line) 35%, transparent); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid #221e18; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; background: var(--panel); position: sticky; top: 0; }
td.mark { text-align: center; width: 64px; }
.dot { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--wait); }
.dot.d-done { background: var(--done); border-color: var(--done); }
.dot.d-doing { background: transparent; border-color: var(--doing); box-shadow: inset 0 0 0 3px var(--doing); }
.role { font-size: 12px; color: var(--muted); }
code.id { color: var(--line); font-size: 12.5px; }

/* 조합 150 */
.bands { display: grid; gap: 8px; }
.band { display: grid; grid-template-columns: 72px 1fr 78px; gap: 12px; align-items: center; font-size: 13.5px; }
.bar { height: 10px; background: #1d1914; border: 1px solid #2b261f; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--line); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* 기록 */
.log { display: grid; gap: 0; border-left: 1px solid var(--line); margin-left: 4px; }
.log div { padding: 6px 0 6px 16px; position: relative; font-size: 13.5px; }
.log div::before { content: ""; position: absolute; left: -4px; top: 13px; width: 7px; height: 7px; background: var(--line); }
.log time { color: var(--muted); margin-right: 10px; font-variant-numeric: tabular-nums; }

@media (max-width: 820px) {
  .flow { grid-template-columns: 1fr; }
  .team + .team { border-left: 1px solid color-mix(in srgb, var(--line) 45%, transparent); border-top: none; }
  .arrow { right: auto; left: 22px; top: auto; bottom: -9px; }
  .band { grid-template-columns: 56px 1fr 66px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>검의 언덕 팀 현황판</h1>
    <p class="muted" id="stage"></p>
    <div class="summary num" id="summary"></div>
  </header>

  <section aria-labelledby="org-h">
    <h2 id="org-h">팀 구축도</h2>
    <div class="org">
      <div class="lead" id="lead"></div>
      <div class="flow" id="flow"></div>
    </div>
  </section>

  <section aria-labelledby="moves-h">
    <h2 id="moves-h">기본 동작 20가지 × 팀</h2>
    <div class="legend"><span><i class="dot d-done"></i>끝</span><span><i class="dot d-doing"></i>하는 중</span><span><i class="dot"></i>아직</span></div>
    <div class="grid-wrap"><table id="moves"></table></div>
  </section>

  <section aria-labelledby="pat-h">
    <h2 id="pat-h">공격 방식 150가지</h2>
    <p class="muted">기본 동작 2~4개를 잇고 속성(불꽃·서리·벼락·피)을 얹어 만든다. 검 300자루가 하나씩 갖는다.</p>
    <div class="bands" id="bands"></div>
  </section>

  <section aria-labelledby="log-h">
    <h2 id="log-h">기록</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
// 현황은 여기만 고친다. 상태: "done" 끝, "doing" 하는 중, "wait" 아직.
const STATE = {
  stage: "지금 12단계: 밤 목표·구역 규칙 · 11 끝 / 12 밤 목표·구역 규칙 / 13 낮 사건·갈림길 / 14 뽑기 손맛 (설계서 docs/content.md)",
  updated: "2026-11-18 17:50",
  lead: {
    name: "총괄",
    model: "Claude Opus 5.5 · Claude Code 대표 모델 (이 대화)",
    does: "설계서로 팀 사이의 약속(동작 id, 신호, 자료 모양)을 정하고, 팀을 차례로 부르고, 끝나면 테스트·화면 확인·커밋·푸시를 한다.",
    status: "doing",
    note: "모양팀이 먼저(겹치지 않는 단계는 동시에), 기능팀이 차례로 잇는다. 단계가 끝나면 테스트·화면 확인·푸시."
  },
  teams: [
    { key: "look", name: "모양팀", model: "Claude Opus 5.5 에이전트 (아트·모션·이펙트를 합침)", status: "doing",
      does: ["모양: 몸, 소품, 재질, 아이콘(코드로 그린 SVG)", "움직임: 코드 곡선과 Mixamo 동작 위에 얹기", "효과: 불똥, 먼지, 땅의 표시, 소리", "확인용 갤러리 장면"],
      files: ["scripts/enemies/enemy_art.gd · enemy_motion.gd", "scripts/world/enemy_fx.gd", "scripts/world/night_art.gd · night_fx.gd", "scripts/world/event_art.gd · event_fx.gd · assets/ui/map/*.svg", "scripts/world/omen_art.gd · pull_timing_fx.gd · scripts/lord/pull_motion.gd", "scripts/debug/*_gallery.gd"],
      gets: "설계서 docs/content.md", gives: "파일 머리의 API → 기능팀이 잇는다",
      note: "끝: 11단계(426ea2e) · 하는 중: 12단계, 13단계, 14단계" },
    { key: "func", name: "기능팀", model: "Claude Opus 5.5 에이전트", status: "doing",
      does: ["규칙과 수치(.tres)", "신호, 화면 연결(EnemyView·main·hud)", "테스트, GDD·CLAUDE.md"],
      files: ["scripts/core/", "data/", "scripts/enemies/enemy_view.gd", "scenes/world/main.gd", "tests/", "docs/"],
      gets: "모양팀이 만든 것 전부", gives: "게임에서 도는 단계",
      note: "끝: 11단계(f635916) · 하는 중: 12단계 밤 목표·구역 규칙 · 남음: 13단계, 14단계" }
  ],
  // 동작별 팀 진행: [아트, 모션, 이펙트, 기능]
  moves: [
    ["sweep", "횡베기", "이음"], ["thrust", "찌르기", "이음"], ["rising", "올려베기", "이음"],
    ["flurry", "연속 찌르기", "이음"], ["crescent", "반월", "이음"], ["retreat", "물러나 베기", "이음"],
    ["pull", "끌어당기기", "이음"], ["smash", "내려찍기", "마무리"], ["spin", "회전베기", "마무리"],
    ["lunge", "돌진베기", "마무리"], ["wave", "검기", "마무리"], ["boomerang", "칼 던지기", "마무리"],
    ["leap", "도약 내려찍기", "마무리"], ["iaido", "발도", "마무리"], ["cross", "십자 베기", "마무리"],
    ["quake", "지진", "마무리"], ["whirl", "소용돌이", "마무리"], ["blink", "순간 베기", "마무리"],
    ["hook", "갈고리 베기", "특수 · 갈고리 검만"], ["parry", "반격 자세", "특수"]
  ],
  progress: {},
  // 팀 상태가 "doing"이면 아래 함수가 그 팀 칸을 모두 하는 중으로 칠한다(따로 적은 동작은 그 값).   // 예: { sweep: ["done","done","doing","wait"] }. 없으면 팀 상태를 따른다.
  bands: [
    ["흔함", 41, 41], ["귀함", 35, 35], ["전설", 28, 28], ["신화", 20, 20], ["초월", 20, 20], ["무한", 6, 6]
  ],
  swords_assigned: 300,
  log: [
    ["11-18 17:47", "기능팀: 11단계 새 적 5종의 규칙과 화면 연결"],
    ["11-18 14:00", "이펙트팀: 11단계 새 적 5종의 효과(EnemyFx)와 갤러리"],
    ["11-18 08:50", "모션팀: 11단계 새 적 5종의 몸 움직임(EnemyMotion)"],
    ["11-18 08:19", "아트팀: 11단계 새 적 5종의 몸(EnemyArt)"],
    ["11-18 07:41", "11~14단계 설계: 적 행동, 밤 목표와 구역 규칙, 낮 사건과 갈림길, 뽑기 손맛"],
    ["11-17 23:13", "10단계 공격 토큰: 표를 가진 적만 덤비고 나머지는 둘레를 돈다"],
    ["11-17 22:27", "관리: 원하는 검 받기 창(` 또는 F6) — 번호·이름·공격 방식·형태·등급·각인·\"갈고리\"로 찾아 칸에 받는다"],
    ["11-17 22:02", "10단계 설계: 공격 토큰(몰려와도 표를 받은 몇 마리만 덤빈다)"],
    ["11-17 21:35", "기능팀: 문서 — 좌클릭 규칙(GDD 2.5), 9단계 끝, CLAUDE.md의 data/attacks와 Moves, 설계서 7절(만들며 정한 것)"],
    ["11-17 21:34", "기능팀: 화면 연결 — MoveFx·MoveMotion을 잇고, 카드에 공격 방식 이름과 동작 아이콘"],
    ["11-17 21:19", "기능팀: 좌클릭을 동작 실행기로 — 기본 동작 20가지, 공격 방식 150가지, 검 300자루 배정"],
    ["11-17 17:25", "이펙트팀: 좌클릭 동작 20가지와 속성 4가지의 효과(MoveFx), 갤러리 도구"],
    ["11-17 16:34", "설계: 갈고리는 갈고리 검(갈고리 베기가 든 방식 12가지, 약 24자루)에서만"],
    ["11-17 16:08", "모션팀: 좌클릭 동작 20가지의 영주 움직임(MoveMotion)"],
    ["11-17 15:41", "아트팀: 좌클릭 동작의 모양과 재질(MoveArt), 동작 20·속성 4 아이콘(MoveIcons)"],
    ["11-17 15:14", "갈고리와 모션 블러: 겨눈 적에게 줄을 걸고 날아가 큰 베기, 먼 배경만 번지는 모션 블러"],
    ["11-14 11:55", "베기 동작을 칼이 맞는 때에 맞춘다: 손이 가장 빠른 때를 찾아 그 직전부터 튼다"],
    ["11-14 11:52", "8단계 뽑기 연출: 땅이 갈라지고, 등급만큼 먼지·불똥·불씨·빛, 뽑힌 칼이 솟아 떠 있다"],
    ["11-14 11:44", "적 모양: 망령은 해진 망토, 늑대는 네발짐승, 거인과 언덕지기는 어둡게 키운 기사"],
    ["11-14 11:44", "언덕을 다시 짓는다: 꼭대기 흙바닥, 비탈과 먼 산, 사진 질감, 바위와 꽂힌 검, 하늘과 안개"],
    ["11-14 10:52", "뽑기 체력 10 → 6: 신화 이상을 더 자주 보게(확률표는 그대로)"],
    ["11-14 10:16", "각인 36종과 고유 능력 45종을 규칙에 넣는다(6단계, 7단계 대부분)"],
    ["11-14 10:02", "칼을 형태·등급마다 다르게 깎고, 베기 궤적과 베기 빛을 새로 만든다"],
    ["11-14 00:26", "마을을 진짜 마을처럼 짓는다"],
    ["11-14 00:04", "때릴 때 화면과 구르기, 걷기를 손본다"]
  ]
};

const LABEL = { done: "끝", doing: "하는 중", wait: "아직" };

// 팀마다 주황색 픽셀 기사. 몸은 같고 든 것이 다르다(총괄: 깃발, 아트: 붓, 모션: 달리는 다리, 이펙트: 불똥, 기능: 망치).
const PAL = { o: "#d9772b", d: "#93461a", l: "#f2a25a", k: "#1a110a", g: "#b9a27a", y: "#ffcf73" };
const BODY = [
  "...ddddd...",
  "..dllllld..",
  "..dkkkkkd..",
  "..ddddddd..",
  "...ooooo...",
  ".ooooooooo.",
  "o.ooooooo.o",
  "o.ooooooo.o",
  "..ooooooo..",
  "..oo...oo..",
  "..oo...oo..",
  "..dd...dd..",
  "..........."
];
const EXTRA = {
  look: [[10,5,"g"],[10,4,"g"],[10,3,"g"],[10,2,"y"],[10,1,"y"],[0,1,"y"],[1,4,"y"],[0,9,"y"]],
  lead: [[0,0,"g"],[0,1,"g"],[0,2,"g"],[0,3,"g"],[0,4,"g"],[0,5,"g"],[1,0,"y"],[2,0,"y"],[1,1,"y"],[2,1,"y"],[1,2,"y"]],
  art: [[10,5,"g"],[10,4,"g"],[10,3,"g"],[10,2,"y"],[10,1,"y"]],
  motion: [[2,9,"."],[3,9,"o"],[1,10,"o"],[2,10,"o"],[3,10,"."],[0,11,"d"],[1,11,"d"],[2,11,"."],[3,11,"."],[7,9,"o"],[8,9,"."],[8,10,"."],[9,10,"o"],[8,11,"."],[9,11,"d"],[10,11,"d"]],
  fx: [[0,1,"y"],[10,0,"y"],[9,3,"y"],[1,4,"y"],[10,8,"y"],[0,9,"y"]],
  func: [[10,5,"g"],[10,4,"g"],[10,3,"g"],[9,2,"l"],[10,2,"l"],[9,1,"l"],[10,1,"l"]]
};
function sprite(key) {
  const rows = BODY.map((r) => r.split(""));
  for (const [x, y, c] of (EXTRA[key] || [])) rows[y][x] = c;
  let rects = "";
  rows.forEach((r, y) => r.forEach((c, x) => { if (c !== ".") rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`; }));
  return `<svg viewBox="0 0 11 13" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chip = (s) => `<span class="chip s-${s}">${LABEL[s]}</span>`;

function render() {
  const S = STATE;
  $("stage").textContent = `${S.stage} · ${S.updated} 기준`;
  const doneTeams = S.teams.filter((t) => t.status === "done").length;
  const made = S.bands.reduce((a, b) => a + b[2], 0);
  const total = S.bands.reduce((a, b) => a + b[1], 0);
  $("summary").innerHTML =
    `<span><b>${doneTeams}/${S.teams.length}</b>팀 끝</span>` +
    `<span><b>${S.moves.length}</b>기본 동작</span>` +
    `<span><b>${made}/${total}</b>공격 방식</span>` +
    `<span><b>${S.swords_assigned}/300</b>검 배정</span>`;

  const L = S.lead;
  $("lead").innerHTML = `<div class="who">${sprite("lead")}<div style="display:grid;gap:4px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>${esc(L.name)}</h3>${chip(L.status)}</div><span class="model" style="font-size:12.5px">${esc(L.model)}</span></div></div>` +
    `<p>${esc(L.does)}</p>` + (L.note ? `<p class="muted" style="font-size:13px">${esc(L.note)}</p>` : "");

  $("flow").innerHTML = S.teams.map((t, i) => `
    <article class="team is-${t.status}">
      <span class="arrow" aria-hidden="true"></span>
      <div class="order">${i + 1}번째</div>
      <div class="who">${sprite(t.key)}<div style="display:grid;gap:4px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(t.name)}</h3>${chip(t.status)}</div><div class="model">${esc(t.model)}</div></div></div>
      <ul>${t.does.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
      <div class="files">맡은 파일: ${t.files.map((f) => `<code>${esc(f)}</code>`).join(", ")}</div>
      <div class="files">받는 것: ${esc(t.gets)}<br>넘기는 것: ${esc(t.gives)}</div>
      ${t.note ? `<p class="note">${esc(t.note)}</p>` : ""}
    </article>`).join("");

  const head = `<tr><th>#</th><th>동작</th><th>역할</th>${S.teams.map((t) => `<th class="mark">${esc(t.name.replace("팀", ""))}</th>`).join("")}</tr>`;
  const rows = S.moves.map((m, i) => {
    const p = S.progress[m[0]] || S.teams.map(() => "done"); // 9단계(좌클릭)는 끝났다
    return `<tr><td class="num muted">${i + 1}</td><td>${esc(m[1])} <code class="id">${m[0]}</code></td><td class="role">${esc(m[2])}</td>` +
      p.map((s, k) => `<td class="mark"><i class="dot ${s === "wait" ? "" : "d-" + s}" title="${esc(S.teams[k].name)}: ${LABEL[s]}"></i></td>`).join("") + `</tr>`;
  }).join("");
  $("moves").innerHTML = `<thead>${head}</thead><tbody>${rows}</tbody>`;

  $("bands").innerHTML = S.bands.map((b) =>
    `<div class="band"><span>${esc(b[0])}</span><div class="bar" role="img" aria-label="${esc(b[0])} ${b[2]}/${b[1]}"><i style="width:${(100 * b[2] / b[1]).toFixed(1)}%"></i></div><span class="num muted">${b[2]} / ${b[1]}</span></div>`).join("");

  $("log").innerHTML = S.log.map((l) => `<div><time>${esc(l[0])}</time>${esc(l[1])}</div>`).join("");
}
render();
</script>
</body>
</html>
